name: Reloc
options:
  bundleIdPrefix: dev.reloc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  Reloc:
    type: application
    platform: iOS
    sources:
      - path: Reloc/Core
      - path: Reloc/UI
      - path: Reloc/Resources/Assets.xcassets
      - path: Reloc/Resources/en.lproj/InfoPlist.strings
        buildPhase: resources
      - path: Reloc/Resources/MFi
        buildPhase: resources
        type: folder
    info:
      path: Reloc/Info.plist
      properties:
        CFBundleDisplayName: Reloc
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "4"
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Reloc Pairing Record
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - dev.reloc.rppairing
              - dev.reloc.mobiledevicepairing
              - com.apple.property-list
              - public.xml
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: dev.reloc.rppairing
            UTTypeDescription: Remote Pairing File
            UTTypeConformsTo:
              - public.data
              - public.content
              - com.apple.property-list
            UTTypeTagSpecification:
              public.filename-extension:
                - rppairing
          - UTTypeIdentifier: dev.reloc.mobiledevicepairing
            UTTypeDescription: Mobile Device Pairing File
            UTTypeConformsTo:
              - public.data
              - public.content
              - com.apple.property-list
            UTTypeTagSpecification:
              public.filename-extension:
                - mobiledevicepairing
                - mobilepair
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Reloc discovers and pairs with this device over the local network. The loopback connection is provided by your external proxy.
        NSBonjourServices:
          - _remotepairing-pairable-host._tcp
          - _remotepairing._tcp
        NSLocationWhenInUseUsageDescription: Reloc uses location access to remain active in the background and activate the system location subscription during injection.
        NSLocationAlwaysAndWhenInUseUsageDescription: Reloc uses location access to remain active in the background during location injection and prevent interruptions.
        UIBackgroundModes:
          - location
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reloc.ios
        SWIFT_OBJC_BRIDGING_HEADER: Reloc/Core/ObjC/Reloc-Bridging-Header.h
        INFOPLIST_FILE: Reloc/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - framework: Vendor/RelocDeviceBridge.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
