name: Build Reloc English IPA

on:
  push:
    branches:
      - tweak/reloc-english
    paths:
      - "Reloc/**"
      - "project.yml"
      - ".github/workflows/build-english-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Reloc.xcodeproj \
            -scheme Reloc \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/RelocDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$RUNNER_TEMP/RelocDerivedData/Build/Products/Release-iphoneos/Reloc.app"
          test -d "$APP"
          test -f "$APP/Reloc"

          # Keep the localized iOS permission prompts in the final app bundle.
          mkdir -p "$APP/en.lproj"
          cp "Reloc/Resources/en.lproj/InfoPlist.strings" "$APP/en.lproj/InfoPlist.strings"

          mkdir -p output/Payload
          ditto "$APP" output/Payload/Reloc.app
          (cd output && /usr/bin/zip -qry Reloc-English-Full-1.0.3.ipa Payload)

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" output/Payload/Reloc.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" output/Payload/Reloc.app/Info.plist
          /usr/bin/unzip -t output/Reloc-English-Full-1.0.3.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reloc-English-Full-1.0.3
          path: output/Reloc-English-Full-1.0.3.ipa
          if-no-files-found: error
          retention-days: 14
